name: CI/CD - Famous Music Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9AM

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install ruff
        run: pip install ruff
      
      - name: Lint
        run: ruff check . --max-line-length=120
      
      - name: Format check
        run: ruff format --check .

  type-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install mypy
        run: pip install mypy
      
      - name: Type check
        run: mypy --strict universal_model.py web_ui.py telegram_bot.py auto_backup.py

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install deps
        # python-dotenv: .env okuma | Pillow: PIL (kapak/gorsel testleri)
        # requests: HTTP testleri | sentry-sdk: opsiyonel hata bildirimi
        run: pip install pytest python-dotenv pillow requests sentry-sdk fastapi uvicorn jinja2
      
      - name: Run integration tests
        run: python -m pytest tests/test_integration.py -v --basetemp="C:\pytest_tmp"
      
      - name: Run rule tests
        run: python -m pytest tests/test_kurallar.py -v --basetemp="C:\pytest_tmp"

      - name: Run growth-engine tests
        run: python -m pytest tests/test_buyume_onerileri.py -v --basetemp="C:\pytest_tmp"

      - name: Run full suite
        run: python -m pytest tests/ -q --basetemp="C:\pytest_tmp"

  security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: TruffleHog - secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: main
          head: HEAD
          extra_args: --only-verified

  backup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run backup
        run: python auto_backup.py
      
      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backups/
          retention-days: 7

  deploy:
    needs: [lint, type-check, test, security]
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to VPS
        run: |
          echo "Deploying to VPS..."
          # Add deployment script here
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}