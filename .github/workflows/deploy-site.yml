name: Deploy Site (Netlify)

# Her main push'unda siteyi Netlify'e otomatik deploy eder.
# Gerekli secret'lar (Settings > Secrets and variables > Actions):
#   NETLIFY_AUTH_TOKEN  — Netlify > Account settings > API tokens
#   NETLIFY_SITE_ID     — Site settings > General > API ID
#
# NOT (2026-10-21): Netlify Lambda'da Python DESTEKLENMIYOR -> fonksiyonlar
# JS olarak netlify/functions/ altinda. Python surumler yerel icin (site/api/).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Netlify Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Validate (testler + config senkron + JS/HTML dengesiz)
        run: |
          python -m pytest tests/test_buyume_onerileri.py tests/test_kurallar.py -q
          python sync_site_analytics.py
          python check_js_braces.py --check
          node --check site/i18n.js
          node --check netlify/functions/analytics.js
          node --check netlify/functions/topluluk.js

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy \
            --dir=site \
            --functions=netlify/functions \
            --site=$NETLIFY_SITE_ID \
            --prod \
            --skip-functions-cache \
            --message "site: ${{ github.sha }}"

      - name: Smoke test (post-deploy)
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          sleep 25
          URL="https://${{ secrets.NETLIFY_SITE_ID }}.netlify.app"
          fail=0
          for path in "/" "/privacy.html" "/epk/bio.html" "/robots.txt" "/sitemap.xml" \
                      "/i18n.js" "/analytics.js" "/assets/gece-masallari-preview-30s.mp3"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$URL$path" || echo "000")
            echo "$path -> $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::Smoke test basarisiz: $path -> $CODE"
              fail=1
            fi
          done
          # API fonksiyonlari
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -X POST \
            "$URL/api/analytics" -H "Content-Type: text/plain" \
            -d '{"path":"/smoke","ua":"gh-action","vw":1280,"lang":"tr-TR"}' || echo "000")
          echo "/api/analytics -> $CODE"
          if [ "$CODE" != "204" ]; then
            echo "::error::Analytics endpoint basarisiz: $CODE"
            fail=1
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$URL/api/topluluk" || echo "000")
          echo "/api/topluluk -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Topluluk endpoint basarisiz: $CODE"
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1
          echo "::notice::Site deploy dogrulandi"

      - name: GitHub Pages senkronu (docs/)
        if: failure() == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python publish_site_github.py || \
            echo "::warning::GitHub Pages senkronu atlandi (token yoksa normal)"

      - name: Commit config sync (varsa)
        if: failure() == false
        run: |
          if ! git diff --quiet -- site/analytics.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/analytics.js
            git commit -m "chore(site): analytics.js config ile senkron" || true
            git push || true
          fi
