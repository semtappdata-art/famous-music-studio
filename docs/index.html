<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Famous Music Studio</title>
<meta name="description" content="Famous Music Studio — AI destekli müzik prodüksiyon stüdyosu. Orijinal şarkılar ve müzik videoları.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0806;
    --bg-alt: #131009;
    --text: #ece6da;
    --text-dim: #a89b84;
    --gold: #c9a15a;
    --gold-bright: #e6c17e;
    --border: rgba(201, 161, 90, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, var(--bg-alt) 0%, var(--bg) 65%);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 1.5rem;
  }

  main {
    max-width: 32rem;
    width: 100%;
    text-align: center;
  }

  .logo {
    width: clamp(140px, 30vw, 200px);
    height: auto;
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(201, 161, 90, 0.18);
    margin-bottom: 2rem;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 2.8rem);
    letter-spacing: 0.04em;
    margin: 0 0 0.6rem;
    color: var(--gold-bright);
  }

  p.tagline {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--text-dim);
    margin: 0 auto 2.5rem;
    max-width: 26rem;
  }

  .links {
    display: flex;
    justify-content: center;
    gap: 0.9rem;
    flex-wrap: wrap;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.65rem 1.3rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }

  .links a:hover,
  .links a:focus-visible {
    border-color: var(--gold);
    color: var(--gold-bright);
    background: rgba(201, 161, 90, 0.06);
  }

  .links svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  footer {
    margin-top: 3.5rem;
    font-size: 0.75rem;
    color: rgba(168, 155, 132, 0.5);
    letter-spacing: 0.03em;
  }

  footer a {
    color: inherit;
    text-decoration: none;
  }

  footer a:hover,
  footer a:focus-visible {
    color: var(--gold);
    text-decoration: underline;
  }

  @media (prefers-reduced-motion: no-preference) {
    main { animation: fade-up 0.6s ease-out both; }
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo.png" alt="Famous Music Studio logosu">
  <h1>Famous Music Studio</h1>
  <p class="tagline">AI destekli müzik prodüksiyon stüdyosu. Orijinal şarkılar ve müzik videoları üretiyoruz.</p>

  <nav class="links">
    <a href="https://instagram.com/famous_music_studio" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
      Instagram
    </a>
    <a href="https://www.youtube.com/channel/UCbbcH8rtQTtz8R66jfKoSZg" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path d="M10.5 9.2L15 12l-4.5 2.8V9.2z" fill="currentColor" stroke="none"/></svg>
      YouTube
    </a>
    <a href="https://www.tiktok.com/@famousmusicstudio" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.2c-.7-.7-1.1-1.7-1.1-2.7h-3v13.4c0 1.4-1.1 2.5-2.5 2.5s-2.5-1.1-2.5-2.5 1.1-2.5 2.5-2.5c.3 0 .5 0 .8.1v-3.1c-.3 0-.5-.1-.8-.1-3.1 0-5.6 2.5-5.6 5.6s2.5 5.6 5.6 5.6 5.6-2.5 5.6-5.6V9.1c1.2.9 2.6 1.4 4.1 1.4V7.4c-1 0-1.9-.4-2.6-1.1z"/></svg>
      TikTok
    </a>
  </nav>

  <footer>
    &copy; 2026 Famous Music Studio &middot;
    <a href="privacy-policy.html">Privacy Policy</a> &middot;
    <a href="terms-of-service.html">Terms of Service</a>
  </footer>
</main>
</body>
</html>
