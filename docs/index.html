<title>Famous Music Studio</title>
<meta name="description" content="Famous Music Studio — AI destekli müzik prodüksiyon stüdyosu. Orijinal şarkılar ve müzik videoları.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0806;
    --bg-alt: #131009;
    --text: #ece6da;
    --text-dim: #a89b84;
    --gold: #c9a15a;
    --gold-bright: #e6c17e;
    --border: rgba(201, 161, 90, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, var(--bg-alt) 0%, var(--bg) 65%);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 1.5rem;
  }

  main {
    max-width: 32rem;
    width: 100%;
    text-align: center;
  }

  .logo-wrap {
    position: relative;
    width: clamp(140px, 30vw, 200px);
    margin: 0 auto 2rem;
    border-radius: 50%;
    overflow: hidden;
    box-shadow:
      0 0 30px 6px rgba(230, 193, 126, 0.45),
      0 0 80px 16px rgba(201, 161, 90, 0.3);
  }

  .logo {
    display: block;
    width: 100%;
    height: auto;
    /* brightness() sadece piksel değerini çarpıyor — siyah zemin (0,0,0)
       çarpımdan etkilenmiyor, sadece altın/sarı piksel gerçekten parlıyor.
       Bu yüzden ayrı bir overlay/mask katmanı yerine doğrudan img üzerinde
       animasyon: "sadece logo içi sarı alan hareketli parlaklık kazansın". */
    filter: brightness(1.2) saturate(1.4) contrast(1.12);
    animation: glow-pulse 2s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
  }

  @keyframes glow-pulse {
    0%, 100% { filter: brightness(1.2) saturate(1.4) contrast(1.12); }
    50% { filter: brightness(1.55) saturate(1.7) contrast(1.12); }
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 2.8rem);
    letter-spacing: 0.04em;
    margin: 0 0 0.6rem;
    color: var(--gold-bright);
  }

  p.tagline {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--text-dim);
    margin: 0 auto 2.5rem;
    max-width: 26rem;
  }

  .links {
    display: flex;
    justify-content: center;
    gap: 0.9rem;
    flex-wrap: wrap;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.65rem 1.3rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }

  .links a:hover,
  .links a:focus-visible {
    border-color: var(--gold);
    color: var(--gold-bright);
    background: rgba(201, 161, 90, 0.06);
  }

  .links svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  /* "Bizi takip et": link listesi latest_release.PLATFORM_LINKLERI'nden
     index_takip_guncelle() ile basılıyor — bu bölgeyi elle düzenleme. */
  .takip { margin: 0 auto; }
  .takip h2 {
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 0.9rem;
  }
  .takip-liste {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.7rem;
  }
  .takip-liste a {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    min-height: 48px;
    padding: 0.6rem 1.2rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .takip-liste a:hover,
  .takip-liste a:focus-visible {
    border-color: var(--gold);
    color: var(--gold-bright);
    background: rgba(201, 161, 90, 0.06);
  }
  .takip-liste a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .takip-liste svg { width: 20px; height: 20px; flex-shrink: 0; color: var(--gold-bright); }
  @media (max-width: 480px) {
    .takip-liste { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .takip-liste a { display: flex; justify-content: center; min-height: 52px; padding: 0.6rem 0.8rem; }
    .takip-liste li:last-child:nth-child(odd) { grid-column: 1 / -1; }
  }

  footer {
    margin-top: 3.5rem;
    font-size: 0.75rem;
    color: rgba(168, 155, 132, 0.5);
    letter-spacing: 0.03em;
  }

  footer a {
    color: inherit;
    text-decoration: none;
  }

  footer a:hover,
  footer a:focus-visible {
    color: var(--gold);
    text-decoration: underline;
  }

  @media (prefers-reduced-motion: no-preference) {
    main { animation: fade-up 0.6s ease-out both; }
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
